services:
  - type: web
    name: peoplepulse-api
    env: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: FRONTEND_URL
        value: https://peoplepulse-hr-287.netlify.app
      - key: DATABASE_URL
        value: ./data/peoplepulse.db
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: HF_API_KEY
        sync: false
    autoDeploy: true
